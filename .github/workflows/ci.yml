name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --python 3.12 --all-extras

      - name: Lint
        run: uv run --python 3.12 ruff check .

      - name: Unit tests
        run: uv run --python 3.12 pytest -q

      - name: Real MCP retrieval smoke test
        run: uv run --python 3.12 python scripts/smoke.py

