[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cn-law-mcp"
version = "0.1.0"
description = "Zero-API-key Chinese law retrieval MCP server with official source links"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yanquan Dev" }]
keywords = ["mcp", "law", "china", "retrieval", "bm25"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[project.scripts]
cn-law-mcp = "cn_law_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cn_law_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/cn_law_mcp/data/law_seed.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

